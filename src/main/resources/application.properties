spring.application.name=vaultiq
spring.docker.compose.enabled=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vaultiq}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vaultiq_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vaultiq123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

groq.api.key=${GROQ_API_KEY}
gemini.api.key=${GEMINI_API_KEY:}
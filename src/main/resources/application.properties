spring.application.name=vaultiq
spring.docker.compose.enabled=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

groq.api.key=${GROQ_API_KEY}
gemini.api.key=${GEMINI_API_KEY:}

# JWT
jwt.secret=${JWT_SECRET:vaultiq-super-secret-key-change-in-production-min-32-chars}
jwt.expiration=86400000

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/google
spring.security.oauth2.client.registration.google.additional-parameters.prompt=select_account

# Session cookies  required for Google OAuth on production (HTTPS)
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# Frontend URL
app.frontend-url=${FRONTEND_URL:http://localhost:8080}

# Supabase S3 Storage
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT}
supabase.s3.region=${SUPABASE_S3_REGION}
supabase.s3.access-key=${SUPABASE_S3_ACCESS_KEY}
supabase.s3.secret-key=${SUPABASE_S3_SECRET_KEY}
supabase.bucket=${SUPABASE_BUCKET}